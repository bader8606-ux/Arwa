<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0b1017"><title>دفعات فلة العقيق</title><link rel="icon" href="vendor/aqiq-icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Aqiq;src:url('vendor/tajawal-400.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Aqiq;src:url('vendor/tajawal-700.woff2') format('woff2');font-weight:700;font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0b1017;color:#e5ebf3;font:15px Aqiq,Arial,sans-serif;line-height:1.8}.card{width:100%;max-width:460px;border:1px solid #303b4a;border-radius:17px;background:#121a24;padding:38px;box-shadow:0 18px 80px #0003}.brand-icon{height:54px;width:54px;display:grid;place-items:center;color:#dbb77b;background:#dbb77b12;border:1px solid #8a704753;border-radius:13px;margin-bottom:26px}svg{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;height:30px;width:30px}.eyebrow{color:#bba078;font-size:11px;margin:0 0 5px}h1{font-size:32px;line-height:1.5;margin:0 0 13px;font-weight:700;color:#eef0f4}p{color:#98a9bd;font-size:13px;margin:0 0 27px;line-height:1.95}label{display:block;color:#aebdd0;font-size:13px;margin-bottom:9px}input,button{font:inherit}input{width:100%;min-width:0;border:1px solid #35465c;border-radius:8px;color:#dae5f1;background:#0e1621;padding:13px 14px;font-size:14px;direction:ltr;text-align:left}input::placeholder{direction:rtl;text-align:right;color:#8298b2;font-size:12px}input:focus-visible,button:focus-visible{outline:2px solid #dbb77b;outline-offset:4px}button{width:100%;border:1px solid #dbb77b;background:#dbb77b;color:#251e14;border-radius:8px;padding:11px 15px;font-size:15px;font-weight:700;margin-top:17px;cursor:pointer;transition:background .2s}button:hover{background:#ebca94}button:disabled{opacity:.6;cursor:wait}.error{color:#eda79c;font-size:12px;line-height:1.9;min-height:18px;margin-top:13px}.status{color:#c3ab84;font-size:12px;margin-top:8px;line-height:1.8}.foot{border-top:1px solid #2a394d;padding-top:20px;margin:20px 0 0;font-size:11px;color:#8298b1}.foot strong{font-weight:400;color:#c9b28d}@media(max-width:440px){body{padding:18px}.card{padding:28px 25px}h1{font-size:29px}.brand-icon{margin-bottom:22px}p{font-size:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>
<body><main class="card"><div class="brand-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M6 21V8l6-5 6 5v13M10 21v-6h4v6M9 9h.01M15 9h.01M9 12h.01M15 12h.01"/></svg></div><p class="eyebrow">مساحة المشروع الخاصة</p><h1>دفعات فلة العقيق</h1><p>دفعاتك وإيصالاتك، في مكان واحد.<br>افتح رابط الوصول الخاص بك، أو أدخل رمز الوصول للاطلاع على لوحة المشروع.</p><form id="unlock-form"><label for="access-code">رمز الوصول الخاص</label><input id="access-code" type="password" required minlength="43" maxlength="43" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="أدخل رمز الوصول"><button id="unlock-button">فتح لوحة الدفعات</button></form><div class="error" id="error" role="alert"></div><div class="status" id="status" role="status"></div><p class="foot">البيانات والمرفقات مشفّرة. <strong>احتفظ برابط الوصول الخاص لك.</strong></p></main><script src="unlock.js"></script></body>
</html>
