<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#142c3c" />
    <title>بُنيان | لوحة المشروع الخاصة</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f5f7f5;
        color: #193442;
        font-family: Arial, sans-serif;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 430px;
        width: 100%;
        background: white;
        border: 1px solid #e6ebe8;
        border-radius: 22px;
        padding: 36px;
        box-shadow: 0 20px 80px #142c3c08;
      }
      .mark {
        width: 54px;
        height: 54px;
        background: #142c3c;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: #b2dac9;
        margin-bottom: 28px;
      }
      svg {
        height: 30px;
        width: 30px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
      }
      h1 {
        font-size: 25px;
        margin: 0 0 12px;
      }
      p {
        font-size: 14px;
        color: #7c898e;
        line-height: 1.9;
        margin: 0 0 23px;
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 10px;
      }
      input {
        width: 100%;
        border: 1px solid #dbe4de;
        padding: 14px;
        border-radius: 9px;
        font-size: 14px;
        direction: ltr;
        text-align: left;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #6bc6aa;
        outline-offset: 2px;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 16px;
        border: 0;
        border-radius: 9px;
        background: #22816b;
        color: white;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .error {
        color: #b14f45;
        font-size: 12px;
        margin-top: 14px;
        min-height: 18px;
      }
      .status {
        font-size: 12px;
        color: #22816b;
        margin-top: 16px;
      }
      .foot {
        font-size: 11px;
        border-top: 1px solid #e6ebe8;
        padding-top: 20px;
        margin: 24px 0 0;
      }
      a {
        color: #22816b;
      }
      @media (max-width: 440px) {
        .card {
          padding: 27px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M3 21h18M6 21V8l6-5 6 5v13M10 21v-6h4v6M9 9h.01M15 9h.01M9 12h.01M15 12h.01"
          />
        </svg>
      </div>
      <h1>لوحة مشروعك، بكل وضوح</h1>
      <p>
        افتح رابط الوصول الخاص لعرض مدفوعاتك وإيصالاتك والتعديل عليها، أو أدخل
        رمز الوصول أدناه.
      </p>
      <form id="unlock-form">
        <label for="access-code">رمز الوصول الخاص</label
        ><input
          id="access-code"
          type="password"
          required
          minlength="43"
          maxlength="43"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="رمز من 43 حرفًا"
        /><button id="unlock-button">فتح لوحة المدفوعات</button>
      </form>
      <div class="error" id="error" role="alert"></div>
      <div class="status" id="status" role="status"></div>
      <p class="foot">
        البيانات والإيصالات مشفّرة. احتفظ برابط الوصول الخاص لك؛ سجّل الدخول
        داخل اللوحة للمزامنة بين أجهزتك بعد تفعيل الخدمة.
      </p>
    </main>
    <script src="unlock.js"></script>
  </body>
</html>
